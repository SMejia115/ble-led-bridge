[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    AsyncTCP
    esp32async/ESPAsyncWebServer
    fauxmoESP@3.4.1
lib_ignore = ESPAsyncTCP
board_build.partitions = huge_app.csv
board_build.flash_size = 4MB

[env:esp32dev-test]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DTEST_MULTI
build_src_filter = +<src/test_multi_strip.cpp>
monitor_speed = 115200
board_build.partitions = huge_app.csv

lib_deps = 
    AsyncTCP
    esp32async/ESPAsyncWebServer
    fauxmoESP
lib_ignore = 
    ESPAsyncTCP
